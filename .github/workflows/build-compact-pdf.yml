name: Build 4-page Shanghai itinerary PDF
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_compact_pdf.py'
      - '.github/workflows/build-compact-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compact-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF dependencies
        run: python -m pip install --quiet reportlab pypdf
      - name: Build and validate exact four-page PDF
        run: python scripts/build_compact_pdf.py
      - name: Commit PDF for download
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Shanghai_Dad_Son_Compact_4pages_2026.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Publish 4-page print-friendly Shanghai itinerary"
            git pull --rebase
            git push
          fi
